MEMORY {
    HDR: start = $0000, size = $0010, type = ro, file = %O, fill = yes;
    B0:  start = $8000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF;
    B1:  start = $8000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF;
    B2:  start = $8000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF;
    FIX: start = $C000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF;
}
SEGMENTS {
    HEADER:  load = HDR, type = ro;
    BANK0:   load = B0, type = ro;
    BANK1:   load = B1, type = ro;
    BANK2:   load = B2, type = ro;
    CODE:    load = FIX, type = ro;
    VECTORS: load = FIX, type = ro, start = $FFFA;
}
